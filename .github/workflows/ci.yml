name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fieldline
          POSTGRES_USER: fieldline
          POSTGRES_PASSWORD: fieldline
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fieldline -d fieldline"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      FIELDLINE_DATABASE_URL: postgresql+psycopg://fieldline:fieldline@localhost:5432/fieldline

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: python -m pip install ".[dev]"

      - name: Lint source and tests
        working-directory: backend
        run: ruff check app tests

      - name: Compile Python modules
        working-directory: backend
        run: python -m compileall -q app tests migrations

      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest

  frontend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Typecheck frontend
        working-directory: frontend
        run: npm run typecheck

      - name: Build frontend
        working-directory: frontend
        env:
          BACKEND_URL: http://127.0.0.1:8000
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run browser smoke tests
        working-directory: frontend
        run: npx playwright test e2e/smoke.spec.ts e2e/standout.spec.ts


  e2e:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fieldline
          POSTGRES_USER: fieldline
          POSTGRES_PASSWORD: fieldline
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fieldline -d fieldline"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      FIELDLINE_DATABASE_URL: postgresql+psycopg://fieldline:fieldline@localhost:5432/fieldline
      FIELDLINE_JWT_SECRET_KEY: e2e-only-secret-key-that-is-at-least-32-bytes-long
      BACKEND_URL: http://127.0.0.1:8000

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install backend
        working-directory: backend
        run: python -m pip install ".[dev]"

      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Start backend
        working-directory: backend
        run: |
          nohup python -m uvicorn app.main:app --host 127.0.0.1 --port 8000 >/tmp/fieldline-backend.log 2>&1 &
          for i in $(seq 1 30); do
            curl --fail --silent http://127.0.0.1:8000/ && exit 0
            sleep 1
          done
          cat /tmp/fieldline-backend.log
          exit 1

      - name: Install frontend
        working-directory: frontend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        run: npm run build

      - name: Install Chromium
        working-directory: frontend
        run: npx playwright install --with-deps chromium

      - name: Run real browser E2E
        working-directory: frontend
        run: npx playwright test e2e/real-backend.spec.ts e2e/standout.spec.ts e2e/deep-product.spec.ts

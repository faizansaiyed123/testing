name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: fieldline
          POSTGRES_USER: fieldline
          POSTGRES_PASSWORD: fieldline
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U fieldline -d fieldline"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    env:
      FIELDLINE_DATABASE_URL: postgresql+psycopg://fieldline:fieldline@localhost:5432/fieldline

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/pyproject.toml

      - name: Install backend
        working-directory: backend
        run: python -m pip install ".[dev]"

      - name: Lint source and tests
        working-directory: backend
        run: ruff check app tests

      - name: Compile Python modules
        working-directory: backend
        run: python -m compileall -q app tests migrations

      - name: Apply migrations
        working-directory: backend
        run: python -m alembic upgrade head

      - name: Run tests
        working-directory: backend
        run: python -m pytest
